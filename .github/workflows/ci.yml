name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci || npm install
      - name: App logic tests
        run: npm test
      - run: pip install -r requirements.txt
      - name: Data tests
        run: python -m pytest -q tests
      - name: Dish files are valid
        run: python scripts/build_dishes.py --offline && git diff --quiet docs/dishes.json || echo "dishes.json is out of date; the refresh workflow will rebuild it"
