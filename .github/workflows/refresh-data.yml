name: Refresh data

# Nightly: restaurant tiles for covered metros (from Geofabrik's daily OpenStreetMap extracts).
# Tuesday: also gas prices (EIA publishes on Monday afternoons), dishes and every US gas station (about 10 GB of extracts).
# Dish or script changes rebuild what they affect.
on:
  schedule:
    - cron: "23 13 * * 2"
    - cron: "41 4 * * *"
  push:
    branches: [main]
    paths: ["data/**", "scripts/**"]
  workflow_dispatch:
    inputs:
      part:
        description: "food, stations, quick (prices, dishes, restaurants) or all (quick plus every US gas station)"
        default: quick

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      WEEKLY: ${{ github.event.schedule == '23 13 * * 2' || github.event.inputs.part == 'all' || github.event.inputs.part == 'stations' }}
      NIGHTLY_ONLY: ${{ github.event.schedule == '41 4 * * *' || github.event.inputs.part == 'food' }}
      STATIONS_ONLY: ${{ github.event.inputs.part == 'stations' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq osmium-tool && pip install -r requirements.txt
      - name: Gas prices
        if: env.NIGHTLY_ONLY != 'true' && env.STATIONS_ONLY != 'true'
        run: python scripts/fetch_gas.py
      - name: Dishes
        if: env.NIGHTLY_ONLY != 'true' && env.STATIONS_ONLY != 'true'
        run: python scripts/build_dishes.py
      - name: Restaurants in covered metros (map tiles)
        if: env.STATIONS_ONLY != 'true'
        run: python scripts/build_food_tiles.py 2>&1 | tee food-log.txt; exit ${PIPESTATUS[0]}
      - name: Commit
        run: scripts/commit_data.sh "Refresh data" docs/gas.json docs/dishes.json docs/food
      - name: US gas stations (map tiles)
        if: env.WEEKLY == 'true'
        run: python scripts/build_fuel_tiles.py 2>&1 | tee fuel-log.txt; exit ${PIPESTATUS[0]}
      - name: Commit gas stations
        if: env.WEEKLY == 'true'
        run: scripts/commit_data.sh "Refresh gas stations" docs/fuel
      - name: Keep the build logs on the refresh-log branch
        if: always()
        run: |
          mkdir -p /tmp/log && cp food-log.txt fuel-log.txt /tmp/log/ 2>/dev/null; ls /tmp/log | grep -q . || echo "no log" > /tmp/log/none.txt
          cd /tmp/log && git init -q -b refresh-log && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Refresh log $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" refresh-log
