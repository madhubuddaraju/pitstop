name: Refresh data

# Gas prices: EIA publishes on Monday afternoons; refresh Tuesday morning.
# Dishes: rebuild descriptions and photos from Wikipedia whenever the dish files change, and monthly.
on:
  schedule:
    - cron: "23 13 * * 2"
    - cron: "41 4 * * *"     # stations only fill in a few boxes per night until every box is current
  push:
    branches: [main]
    paths: ["data/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Gas prices
        run: python scripts/fetch_gas.py
      - name: Dishes
        run: python scripts/build_dishes.py
      - name: US gas stations (map tiles)
        continue-on-error: true
        run: python scripts/build_fuel_tiles.py 2>&1 | tee fuel-log.txt; exit ${PIPESTATUS[0]}
      - name: Commit if changed
        run: |
          git add docs
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh gas prices, stations and dishes $(date -u +%Y-%m-%d)"
          git push
      - name: Keep the station build log on the refresh-log branch
        if: always()
        run: |
          mkdir -p /tmp/log && cp fuel-log.txt /tmp/log/ 2>/dev/null || echo "no log" > /tmp/log/fuel-log.txt
          cd /tmp/log && git init -q -b refresh-log && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Refresh log $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" refresh-log
