name: Live check

# Loads the published page at real locations and checks places, dishes and prices all come through.
on:
  schedule:
    - cron: "37 14 * * 3"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - run: python tests/live/check_live.py https://madhubuddaraju.github.io/pitstop/
